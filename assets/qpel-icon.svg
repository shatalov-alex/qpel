<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">qpel</title>
  <desc id="desc">A cupel, the bone-ash cup in which precious metal is refined, holding one bright bead that blends gold into silver.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2433"/>
      <stop offset="1" stop-color="#10141d"/>
    </linearGradient>
    <radialGradient id="furnace" cx="0.5" cy="0.78" r="0.55">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.4"/>
      <stop offset="0.55" stop-color="#ff5a1f" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8ae9a"/>
      <stop offset="0.45" stop-color="#e7e1d3"/>
      <stop offset="1" stop-color="#a79c86"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#e2dbcb"/>
    </linearGradient>
    <linearGradient id="hollow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c705b"/>
      <stop offset="0.6" stop-color="#b3a78f"/>
      <stop offset="1" stop-color="#d8d0bf"/>
    </linearGradient>
    <linearGradient id="bead" x1="0.1" y1="0.2" x2="0.9" y2="0.8">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="0.42" stop-color="#f2b33d"/>
      <stop offset="0.58" stop-color="#c9ced8"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.36" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="melt" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#ff7a2a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.5" stop-color="#ffc061" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffc061" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.6" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#3b2a12" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3b2a12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#furnace)"/>

  <g transform="translate(256 256) scale(1.16) translate(-256 -290)">
  <!-- the cupel: a wide, shallow, thick-walled cup of bone ash, on the hearth -->
  <ellipse cx="256" cy="372" rx="150" ry="22" fill="#000000" opacity="0.35"/>
  <path d="M84 276 L118 352 A138 40 0 0 0 394 352 L428 276 Z" fill="url(#side)"/>
  <ellipse cx="256" cy="276" rx="172" ry="54" fill="url(#rim)"/>
  <!-- its hollow, glowing with the melt -->
  <ellipse cx="256" cy="279" rx="124" ry="36" fill="url(#hollow)"/>
  <ellipse cx="256" cy="282" rx="104" ry="28" fill="url(#melt)"/>

  <!-- the bead of refined metal: gold into silver -->
  <circle cx="256" cy="250" r="96" fill="url(#halo)"/>
  <ellipse cx="258" cy="292" rx="52" ry="10" fill="#5a3a14" opacity="0.45"/>
  <circle cx="256" cy="250" r="54" fill="url(#bead)"/>
  <circle cx="256" cy="250" r="54" fill="url(#shade)"/>
  <circle cx="256" cy="250" r="54" fill="url(#shine)"/>
  <ellipse cx="236" cy="229" rx="15" ry="8" transform="rotate(-30 236 229)" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
