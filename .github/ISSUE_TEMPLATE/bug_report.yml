name: Bug report
description: Something qpel does wrong, including a kernel that translates incorrectly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command and a minimal kernel or program (CUDA, Metal, .qpel or .qpel.json). For mismatches, the behaviour row or fuzz seed.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The error or the first differing values.
      render: text
  - type: input
    id: version
    attributes:
      label: qpel commit
      placeholder: "git rev-parse --short HEAD"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, clang / Xcode / nvcc versions, GPU if relevant.
