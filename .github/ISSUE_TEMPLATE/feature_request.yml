name: Feature request
description: A construct, backend or tool you would like qpel to support.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need, and why
      description: The use case first, for example the kernels or library you want to move.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could look in qpel, if you have an idea. The roadmap (portable/ROADMAP.md) shows what is planned.
